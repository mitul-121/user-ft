name: CI/CD Pipeline for Node Express App frontend
on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code1
        uses: actions/checkout@v3

      - name: step up node js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
        
      - name: install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: run tests
        working-directory: ./frontend
        run: npm test
    
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3
        
      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build docker image
        working-directory: ./frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-copy-frontend:latest -t ${{ secrets.DOCKER_USERNAME }}/user-copy-frontend:${{ github.sha }} .
        
      - name: push docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-copy-frontend:latest && docker push ${{ secrets.DOCKER_USERNAME }}/user-copy-frontend:${{ github.sha }} 

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: deploy to server
        run: echo "Deploying to server..." 
             echo "${{ secrets.DOCKER_USERNAME }}/user-copy-frontend:latest"
          

            
        