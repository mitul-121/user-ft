name: CI/CD Pipeline for Node Express App backend

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: npm test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
         
      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-copy-backend:latest -t ${{ secrets.DOCKER_USERNAME }}/user-copy-backend:${{ github.sha }} .
      
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-copy-backend:latest && docker push ${{ secrets.DOCKER_USERNAME }}/user-copy-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: deploy to server
        run: echo "Deploying to server..." 
             echo "${{ secrets.DOCKER_USERNAME }}/user-copy-backend:latest"